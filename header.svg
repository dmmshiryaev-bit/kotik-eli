<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 150" width="940" height="150">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
    @keyframes appear {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes colorShift {
        0% { fill: #ff86c8; }
        33% { fill: #c86bff; }
        66% { fill: #ffb3de; }
        100% { fill: #ff86c8; }
    }
    .letter {
        font-family: Arial, sans-serif;
        font-weight: 900;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation:
          appear 0.25s ease forwards,
          colorShift 7.0s linear infinite,
          dna 2.6s ease-in-out infinite;
    }
    .sub {
        font-family: Arial, sans-serif;
        font-weight: 700;
        opacity: 0;
        animation: appear 0.25s ease forwards;
    }

  @keyframes dna {
    0%   { transform: translateY(0px) scale(1); }
    20%  { transform: translateY(-16px) scale(1.06); }
    45%  { transform: translateY(0px) scale(1); }
    60%  { transform: translateY(-7px) scale(1.03); }
    80%  { transform: translateY(0px) scale(1); }
    100% { transform: translateY(0px) scale(1); }
  }
    </style>
  </defs>
  <rect width="940" height="150" fill="#0a0a14"/>
